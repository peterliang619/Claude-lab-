<!DOCTYPE html>
<html>
<head>
    <title>Image Test</title>
    <style>
        body { font-family: Arial; padding: 20px; }
        img { max-width: 300px; border: 2px solid #ccc; margin: 10px; }
        .success { color: green; }
        .error { color: red; }
    </style>
</head>
<body>
    <h1>Image Path Test</h1>
    <p>If you see the images below, the paths are correct:</p>

    <div>
        <h3>Image 1: POOLROOM</h3>
        <img src="images/poolroom.jpg" alt="Poolroom" onerror="this.style.border='2px solid red'">
    </div>

    <div>
        <h3>Image 2: Architecture Corridor</h3>
        <img src="images/architecture-corridor.jpg" alt="Corridor" onerror="this.style.border='2px solid red'">
    </div>

    <div>
        <h3>Image 3: Modern Building</h3>
        <img src="images/modern-building.jpg" alt="Building" onerror="this.style.border='2px solid red'">
    </div>

    <hr>
    <p><strong>If images have RED border:</strong> Path issue or not using a web server</p>
    <p><strong>If images have GRAY border:</strong> Images loaded successfully!</p>
</body>
</html>
